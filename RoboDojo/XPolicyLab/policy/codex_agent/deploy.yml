policy_name: codex_agent
protocol: ws
host: localhost
bench_name: null
task_name: stack_blocks
env_cfg_type: null
seed: null
eval_batch: false

action_type: ee
port: 6000

# The GPU policy service reaches the local bridge through the reverse tunnel.
# CODEX_BRIDGE_URL or the flat bridge_url override takes precedence.
bridge_url: http://localhost:8765
bridge:
  request_timeout_s: 105

# Deterministic interpolation only. These are per-simulator-step increments,
# not workspace bounds or task-specific limits.
motion:
  delta_p_max_m: 0.005
  delta_theta_max_rad: 0.035
  max_target_translation_m: 0.05
  max_target_rotation_rad: 0.35
  settle_steps: 3
  gripper_open: 1.0
  gripper_close: 0.0

images:
  jpeg_quality: 88

# Decisions can exceed the websocket keepalive interval; request timeouts above
# provide the relevant failure boundary.
ws_ping_interval_s: null
ws_ping_timeout_s: null
