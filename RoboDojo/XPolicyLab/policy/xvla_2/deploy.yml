# Basic experiment configuration
policy_name: xvla_2
protocol: ws
host: localhost
port: null

bench_name: null
task_name: null
ckpt_name: null
env_cfg_type: arx_x5
action_type: ee
seed: 0
# eval_batch=true：main.py 读到 true 时保留 num_envs（sim_config.yml=10），
# 多个 episode 在单 Isaac Sim 实例内并行跑（6 episodes ≈ 1 episode 时长）。
# false 时 main.py 强制 num_envs→1，episodes 串行，速度慢 ~6 倍。
eval_batch: true

# 模型来源：本地 checkpoint 目录优先（已就位于 /data/checkpoints）。
# 当前为参考项目官方 X_VLA checkpoint（RoboDojo 参考训练产物）：
#   /data/checkpoints/x_vla/robodojo/ckpt/RoboDojo/X_VLA/RoboDojo-sim-arx_x5-ee-0/ckpt-100000
# 本地目录不存在时视为 HF repo id 兜底，from_pretrained 两种都直接支持。
# setup_eval_policy_server.sh 会用 --ckpt 覆盖此值。
model: /data/checkpoints/x_vla/robodojo/ckpt/RoboDojo/X_VLA/RoboDojo-sim-arx_x5-ee-0/ckpt-100000

# "auto" 选择 CUDA（可用时）。生产服务器通常由 robodojo.sh server 覆盖为 cuda:0。
device: auto

# Flow-matching 去噪迭代数（不是仿真执行步数）。
steps: 10

# 参考模型训练 domain=0（RoboDojo_ee 未注册）。
# 本仓库训练模型 arx_ee6d 为 DATA_DOMAIN_ID["arx_x5_ee"]=6，需改回 6。
domain_id: 0

# gripper 反转约定：参考官方 ee6d 模型 20d 夹爪 1=开，无反转 → false
# （输入/输出均不做 1-g 反转）。本仓库训练数据 1=闭合，才需设 true。
invert_gripper: false

# image_mask 前置有效视角数：参考模型只训过 cam_head → 1（其余视角 mask=false，
# 等价参考侧补零，不进网络）。本仓库模型 3 路全用，需改回 null/缺省。
valid_views: 1

# ── 切回本仓库训练模型（xvla-ee6d）时按以下约定改回 4 项 ─────────
#   model:           /data/checkpoints/xvla-ee6d/020000   # 本仓库 arx_ee6d checkpoint
#   domain_id:       6                                     # DATA_DOMAIN_ID["arx_x5_ee"]
#   invert_gripper:  true                                  # 训练数据 1=闭合，双向反转
#   valid_views:     3                                     # 3 路相机全用
# actions_per_chunk / steps 参考也用 30 / 10，无需改。
# 图像管线无需改：torchvision Resize(224,224,BICUBIC)+ImageNet 归一化与参考训练
# 完全一致（参考自身推理的 HF processor 与本管线也一致，见 preprocessor_config.json）。

# 全 chunk 模式：每次 get_action 返回 num_actions 个动作，仿真端执行完整个
# chunk 后再请求下一次预测（与官方 X_VLA 一致；官方 19 次预测跑完 551 帧 episode）。
actions_per_chunk: 30

# 策略服务器日志：每预测输出 [xvla_2][io]（state16/20 + 完整 30x16 动作 chunk），
# 用 evaluation/robodojo/parse_log.py 可还原 episode。
log_io: true

# 仿真端每步打印 [xvla_2][sim]（deploy.py 开关，默认关；落入仿真 stdout，去向不可控）。
# 注意：完整逐帧视频不依赖此开关 —— deploy.py 每步 get_obs 即触发仿真自带录制。
sim_step_log: false

# X-VLA 推理可能超过 ws 默认 keepalive 窗口；应用层请求已能检测死连接，
# 因此关闭协议层 ping，避免健康的长推理被误断。
ws_ping_interval_s: null
ws_ping_timeout_s: null
