policy_name: xvla_lerobot
protocol: ws
host: localhost
port: null

bench_name: null
task_name: null
ckpt_name: null
checkpoint_path: null
env_cfg_type: arx_x5
action_type: ee
seed: 0
eval_batch: true
obs_transform_pipeline: null

domain_id: 6
steps: 10
device: cuda

# The model predicts 30 anchors over one second. The adapter resamples them to
# 25 Hz controls and returns this many controls before the next observation.
control_hz: 25
actions_per_chunk: 5

# Structured startup and per-request logs. Image pixels are never printed.
log_io: true
log_full_actions: false

ws_ping_interval_s: null
ws_ping_timeout_s: null
