policy_name: agent_policy
protocol: ws
host: localhost
bench_name: null
task_name: null
env_cfg_type: null
seed: null
eval_batch: false

action_type: ee
port: 6000

# The GPU policy service reaches the local bridge through the reverse tunnel.
# CODEX_BRIDGE_URL or the flat bridge_url override takes precedence.
bridge_url: http://localhost:8765
bridge:
  request_timeout_s: 105

# Transport encoding only. The Bridge stores these received JPEG bytes under
# its workspace; storage and motion synthesis are configured by codex_agent.
images:
  jpeg_quality: 88

# Inject the task demo selected by codex_agent/experience_library/index.json.
experience:
  enabled: true

# JSON lines on stdout for observation state and returned 16-D action chunks.
log_io: true

# Decisions can exceed the websocket keepalive interval; request timeouts above
# provide the relevant failure boundary.
ws_ping_interval_s: null
ws_ping_timeout_s: null
