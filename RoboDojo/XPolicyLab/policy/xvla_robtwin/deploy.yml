policy_name: xvla_robtwin
protocol: ws
host: localhost
port: 6000

bench_name: null
task_name: null
env_cfg_type: null
seed: null
eval_batch: true

checkpoint_num: null
obs_transform_pipeline: null

# X-VLA-RoboTwin2 was trained with absolute dual-arm EE6D actions and one
# head-camera view. The adapter always enforces action_type=ee and domain_id=6.
action_type: ee
prompt: null
model_path: checkpoints/shared/X-VLA-RoboTwin2
processor_path: checkpoints/shared/X-VLA-RoboTwin2
lora_path: null
domain_id: 6
steps: 10
device: cuda

# X-VLA emits a sigmoid close probability. RoboDojo expects 1=open, 0=closed.
gripper_close_threshold: 0.7

# Emit paired observation/action records for the first requests.
log_io: true
log_max_requests: 10
log_full_actions: false
